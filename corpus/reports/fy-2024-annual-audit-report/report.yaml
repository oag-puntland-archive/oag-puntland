summary:
  en: The 2024 Annual Financial Statements Audit Report of the Puntland Government, published on June 30, 2025, was prepared by the Office of the Auditor General (OAG). The report covers the fiscal year ending December 31, 2024, and assesses the accuracy of the accounts prepared by the Office of the Accountant General.
  so: Warbixinta Xisaab-xirka Sanadlaha ee Dawladda Puntland ee 2024, oo la daabacay Juun 30, 2025, waxaa diyaariyay Xafiiska Hantidhawrka Guud (XHG). Warbixintani waxay daboolaysaa sanad-miisaaniyeedka dhammaaday Diseembar 31, 2024, iyadoo qiimaynaysa saxnaanta xisaabaadka uu diyaariyay Xafiiska Xisaabiyaha Guud.
